name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      API_ID: "12345"
      API_HASH: ci-placeholder
      BOT_TOKEN: 12345:ci-placeholder
      ADMIN_IDS: "123456"
      BUNAI_API_KEY: ci-placeholder
      ADMIN_WALLET_BSC: "0x0000000000000000000000000000000000000000"
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - run: python -c "import asyncio; from bot.database.session import init_db; asyncio.run(init_db())"
      - run: python -m compileall -q bot
      - run: python -m pyflakes bot
      - run: python -m unittest discover -s tests -v